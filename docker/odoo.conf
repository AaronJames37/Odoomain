[options]
; Local development config. Deliberately NOT the production config:
; on a dev machine we want threaded mode + dev reload, not the low-RAM
; multi-worker setup the 4GB server runs.

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_password

; Order matters: enterprise must come before the image's community addons
; so enterprise variants win, and our custom addons come first of all.
addons_path = /mnt/custom-addons,/mnt/enterprise-addons,/usr/lib/python3/dist-packages/odoo/addons

; workers=0 -> threaded mode. Required for --dev to work, and far easier
; to attach a debugger to. Production uses workers=2.
workers = 0
max_cron_threads = 1

; Generous limits: local solves (nesting) shouldn't get killed mid-run.
limit_time_cpu = 3600
limit_time_real = 7200
limit_memory_soft = 4294967296
limit_memory_hard = 5368709120

; Local admin password for the database manager UI.
admin_passwd = admin

; Handy in dev: auto-reload python, reload XML views on change.
; (Pass --dev=all on the command line, or uncomment below.)
; dev_mode = reload,qweb,xml

log_level = info
